# Prometheus configuration for Safa Hawa
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Scrapes the FastAPI service metrics (including safahawa_data_age_seconds)
  - job_name: "safahawa-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]

  # Scrapes the background poller daemon metrics
  - job_name: "safahawa-poller"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["poller:8001"]
