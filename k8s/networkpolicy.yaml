apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-access-policy
  namespace: safa-hawa
  labels:
    app.kubernetes.io/name: postgres-network-policy
spec:
  # Apply this policy to the PostgreSQL database pod
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    # Only allow incoming connections from the API backend, the Poller, and the Migration Job
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: poller
        - podSelector:
            matchLabels:
              app: migration
      ports:
        - protocol: TCP
          port: 5432
    # NOTE: The web frontend (app: web) is NOT in this list and will be blocked from connecting directly to Postgres.
