apiVersion: v1
kind: Secret
metadata:
  name: safahawa-secrets
  namespace: safa-hawa
  labels:
    app.kubernetes.io/name: safa-hawa
type: Opaque
stringData:
  POSTGRES_USER: "hawa"
  POSTGRES_PASSWORD: "hawa_strong_cluster_password"
  # Connection string consumed by the API and Poller
  DATABASE_URL: "postgresql+psycopg://hawa:hawa_strong_cluster_password@postgres.safa-hawa.svc.cluster.local:5432/safahawa"
