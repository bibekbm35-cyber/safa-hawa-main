apiVersion: v1
kind: ConfigMap
metadata:
  name: safahawa-config
  namespace: safa-hawa
  labels:
    app.kubernetes.io/name: safa-hawa
data:
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "safahawa"
  UPSTREAM_URL: "https://air-quality-api.open-meteo.com/v1/air-quality"
  POLL_INTERVAL_MINUTES: "15"
  LOOKBACK_HOURS: "6"
  LOG_LEVEL: "INFO"
  API_BASE_URL: "/api/v1"
